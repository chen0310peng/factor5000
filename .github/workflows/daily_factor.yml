name: daily factor backtest

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install deps
        run: pip install pandas numpy requests

      - name: run backtest
        run: python dynamic_factor_select.py --refresh
        timeout-minutes: 55

      - name: push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/factor5000/selected_top500.json
          git diff --cached --quiet || git commit -m "daily factor selection"
          git push
